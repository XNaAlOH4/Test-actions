name: Run C program

on:
  schedule:
    # Runs at 00:00 UTC every 3rd day of the month.
    - cron: '0 0 */3 * *'
  
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C program
        run: gcc main.c -o ./main

      - name: Run
        run: ./main
